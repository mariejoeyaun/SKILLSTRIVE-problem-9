<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
         <h1>SkillStrive Dashboard</h1>
         <p>Track your coding journey visually</p>
    </header>  

    <main class="grid-layout">
        
        <!-- Left Column: Forms -->
        <section class="left-panel">
         <h2>🎯 Manage Skills</h2>

          <div class="form-box">
            <h3>Add Skill</h3>
            <form id="skillForm">
                <input type="text" id="skillName" placeholder="Skill name" required>
                <input type="number" id="targetHours" placeholder="Target hours" min="1" required>
                <button type="submit">Add</button>
            </form>
          </div>

           <div class="form-box">
              <h3>Log Hours</h3>
              <form id="logForm">
                <select id="logSkill"></select>
                <input type="number" id="logHours" placeholder="Hours" min="1" required>
                <button type="submit">Log</button>
              </form>
           </div>
    </section>
