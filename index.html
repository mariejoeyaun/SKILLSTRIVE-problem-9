<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillStrive Dashboard</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
         <h1>SkillStrive Dashboard</h1>
         <p>Track your coding journey visually</p>
    </header>  

    <main class="grid-layout">

        <!-- Left Column: Forms -->
        <section class="left-panel">
         <h2>🎯 Manage Skills</h2>

          <div class="form-box">
            <h3>Add Skill</h3>
            <form id="skillForm">
                <input type="text" id="skillName" placeholder="Skill name" required>
                <input type="number" id="targetHours" placeholder="Target hours" min="1" required>
                <button type="submit">Add</button>
            </form>
          </div>
          
    </section>

    <!-- Right Column: Progress -->
    <section class="right-panel">
      <h2>📊 Progress Overview</h2>
      <div id="skillsContainer"></div>
    </section>
  </main>
  
 <footer>
    <p>SkillStrive © 2026</p>
  </footer>

   <script src="script.js"></script>

</body>
</html>
